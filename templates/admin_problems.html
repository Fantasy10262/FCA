{% extends "base.html" %}
{% block title %}题目管理{% endblock %}
{% block content %}
<div class="row-between">
  <h1>题目管理</h1>
  <a class="btn" href="{{ url_for('admin_problem_edit') }}">+ 新增题目</a>
</div>
<table class="table">
  <thead><tr><th>ID</th><th>标题</th><th>难度</th><th>语言</th><th>默认</th><th>操作</th></tr></thead>
  <tbody>
    {% for p in problems %}
    <tr>
      <td>{{ p.id }}</td>
      <td>{{ p.title }}</td>
      <td><span class="tag tag-{{ p.difficulty }}">{{ p.difficulty }}</span></td>
      <td class="muted">{{ p.allowed_languages }}</td>
      <td>{{ p.default_language }}</td>
      <td class="ops">
        <a href="{{ url_for('admin_problem_edit', pid=p.id) }}">编辑</a>
        <a href="{{ url_for('admin_tests', pid=p.id) }}">测试用例</a>
        <form method="post" action="{{ url_for('admin_problem_delete', pid=p.id) }}" onsubmit="return confirm('确定删除该题目及其测试用例？')">
          <button class="link danger">删除</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="6" class="muted">暂无题目。</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
