# ============================================================
# FCA 路线 B：应用 + Postgres 同机 docker-compose 一体托管
# 彻底不依赖 Supabase，数据 100% 自控。需 2核4G 以上。
# ------------------------------------------------------------
# 在仓库根目录执行：
#   cp deploy/.env.example deploy/.env        # 填写 OJ_SECRET 和 POSTGRES_PASSWORD（DATABASE_URL 留空）
#   docker compose -f deploy/docker-compose.postgres.yml --env-file deploy/.env up -d --build
# ============================================================
services:
  db:
    image: postgres:16-alpine
    container_name: fca-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oj
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fca-net

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fca:latest
    container_name: fca-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      OJ_SECRET: ${OJ_SECRET}
      # 自动拼出容器内 Postgres 连接串（服务名 db:5432）
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/oj
      PYTHONUNBUFFERED: "1"
      PORT: "5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - fca-net

  nginx:
    image: nginx:1.27-alpine
    container_name: fca-nginx
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www:/var/www/certbot:ro
    networks:
      - fca-net

volumes:
  pgdata:

networks:
  fca-net:
    driver: bridge
