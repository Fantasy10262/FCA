# ============================================================
# FCA 路线 A：应用跑在 VPS，数据库复用 Supabase 免费 Postgres
# 零迁移、2G 内存即可，数据库完全不用管。
# ------------------------------------------------------------
# 在仓库根目录执行：
#   cp deploy/.env.example deploy/.env        # 填写 OJ_SECRET 和 DATABASE_URL
#   docker compose -f deploy/docker-compose.supabase.yml --env-file deploy/.env up -d --build
# ============================================================
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fca:latest
    container_name: fca-app
    restart: always
    environment:
      OJ_SECRET: ${OJ_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      PYTHONUNBUFFERED: "1"
      PORT: "5000"
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fca-net

  nginx:
    image: nginx:1.27-alpine
    container_name: fca-nginx
    restart: always
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www:/var/www/certbot:ro
    networks:
      - fca-net

networks:
  fca-net:
    driver: bridge
